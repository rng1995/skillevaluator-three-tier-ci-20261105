# Generated by SkillEvaluator all-tier CI onboarding.
name: Skill checks (all tiers)
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
  pull-requests: read
  actions: read
jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-all-tiers.yml@e5c46e51bb9fa1bb058e0f579dd5dab72319be48
    with:
      tiers: 1,2,3
      paths: skills
      min-score: 70
      scan-mode: auto
      env-mode: docker
      provider: nv_build
      embedding-provider: nv_build
      model: nvidia/nemotron-3.5-lightning-30b-a3b
      embedding-model: nvidia/nemotron-3-embed-1b
      agents: ''
      runner: ubuntu-24.04
      tools-repository: NVIDIA/SkillEvaluator
      tools-ref: e5c46e51bb9fa1bb058e0f579dd5dab72319be48
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:a3baec51f48145cdf9de05a5ab054d9576f62f1de0f5276b788410f5c17747d4
      tier3-required: false
      n-attempts: 1
      n-concurrent: 2
      timeout-minutes: 30
      environment: skillevaluator
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
